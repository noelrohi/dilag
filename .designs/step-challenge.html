<!doctype html>
<html lang="en" data-title="Step Challenge" data-screen-type="mobile">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=393, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: "Outfit", system-ui, sans-serif;
        --color-background: #0d1220;
        --color-foreground: #f7f3e8;
        --color-card: #171d2d;
        --color-primary: #f6b44b;
        --color-accent: #62d6a7;
        --color-muted-foreground: #98a1b6;
        --color-border: rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body
    style="width: 393px; height: 852px; margin: 0; overflow: hidden"
    class="bg-background text-foreground font-sans"
  >
    <div class="h-full pt-[47px] pb-[16px] relative overflow-hidden">
      <header class="px-6 flex items-center justify-between">
        <button class="w-11 h-11 rounded-2xl bg-card border border-border grid place-items-center">
          <span class="iconify" data-icon="tabler:chevron-left" data-width="23"></span>
        </button>
        <p class="font-extrabold text-primary">New duel</p>
      </header>

      <main class="px-6 mt-7">
        <section>
          <p class="text-sm text-muted-foreground font-medium">Challenge friends</p>
          <h1 class="mt-1 text-[34px] leading-9 font-extrabold tracking-tight">Start a step war</h1>
        </section>

        <section class="mt-7 rounded-[32px] bg-card border border-border p-6">
          <p class="text-sm text-muted-foreground font-semibold">Daily target</p>
          <div class="mt-3 flex items-end justify-between">
            <h2 class="text-[46px] leading-none font-extrabold tracking-[-0.04em]">12,000</h2>
            <span class="mb-1 text-primary font-bold">steps</span>
          </div>
          <div class="mt-6 grid grid-cols-2 gap-3">
            <button class="h-12 rounded-2xl bg-background border border-border font-extrabold">
              − 1k
            </button>
            <button class="h-12 rounded-2xl bg-primary text-[#2a1804] font-extrabold">+ 1k</button>
          </div>
        </section>

        <section class="mt-7">
          <div class="flex items-center justify-between">
            <h3 class="text-xl font-extrabold">Rivals</h3>
            <p class="text-sm text-accent font-bold">3 selected</p>
          </div>
          <div class="mt-4 space-y-3">
            <div
              class="rounded-[22px] bg-card border border-primary/35 p-4 flex items-center gap-3"
            >
              <div
                class="w-11 h-11 rounded-2xl bg-primary text-[#2a1804] grid place-items-center font-extrabold"
              >
                M
              </div>
              <div class="flex-1">
                <p class="font-bold">Maya</p>
                <p class="text-sm text-muted-foreground">Elite I</p>
              </div>
              <span
                class="iconify text-primary"
                data-icon="tabler:circle-check-filled"
                data-width="24"
              ></span>
            </div>
            <div
              class="rounded-[22px] bg-card border border-primary/35 p-4 flex items-center gap-3"
            >
              <div class="w-11 h-11 rounded-2xl bg-white/10 grid place-items-center font-extrabold">
                J
              </div>
              <div class="flex-1">
                <p class="font-bold">Jon</p>
                <p class="text-sm text-muted-foreground">Warrior I</p>
              </div>
              <span
                class="iconify text-primary"
                data-icon="tabler:circle-check-filled"
                data-width="24"
              ></span>
            </div>
            <div
              class="rounded-[22px] bg-card border border-primary/35 p-4 flex items-center gap-3"
            >
              <div
                class="w-11 h-11 rounded-2xl bg-accent/20 text-accent grid place-items-center font-extrabold"
              >
                A
              </div>
              <div class="flex-1">
                <p class="font-bold">Ari</p>
                <p class="text-sm text-muted-foreground">Scout III</p>
              </div>
              <span
                class="iconify text-primary"
                data-icon="tabler:circle-check-filled"
                data-width="24"
              ></span>
            </div>
          </div>
        </section>

        <section class="mt-7 rounded-[24px] bg-primary/10 border border-primary/25 p-4 flex gap-3">
          <span
            class="iconify text-primary shrink-0"
            data-icon="tabler:bolt-filled"
            data-width="26"
          ></span>
          <p class="text-sm leading-5 text-muted-foreground">
            <span class="text-foreground font-bold">Reward:</span> winner earns 2 promotion sparks
            toward the next rank.
          </p>
        </section>
      </main>

      <div class="absolute left-6 right-6 bottom-[14px]">
        <button
          class="w-full h-16 rounded-[24px] bg-primary text-[#2a1804] font-extrabold text-lg shadow-xl shadow-primary/15"
        >
          Launch challenge
        </button>
      </div>
    </div>
  </body>
</html>
